# MDM НСИ на сервере в закрытом контуре (nginx). Сборка: VITE_USE_MOCKS=false npm run build → содержимое dist/ в /opt/mdm-nsi/app.
# Фронтенд — статика; /api проксируется на бэкенд (контракт — docs/API.md).

server {
    listen 443 ssl http2;
    server_name mdm.zavod.local;

    ssl_certificate     /etc/nginx/tls/mdm.zavod.local.crt;   # сертификат внутреннего УЦ
    ssl_certificate_key /etc/nginx/tls/mdm.zavod.local.key;

    root /opt/mdm-nsi/app;
    index index.html;

    # Ассеты с хэшем в имени — кешируются навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API бэкенда (несколько экземпляров — см. upstream ниже)
    location /api/ {
        proxy_pass http://mdm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50m;   # вложения (BLOB-атрибуты)
    }

    # SPA: любые маршруты приложения → index.html (без кеша, чтобы обновления подхватывались сразу)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}

upstream mdm_backend {
    least_conn;
    server 10.0.10.21:8080;
    server 10.0.10.22:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name mdm.zavod.local;
    return 301 https://$host$request_uri;
}
