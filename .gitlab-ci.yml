# Для локального GitLab в закрытом контуре. Образ node должен быть в локальном registry,
# npm — смотреть на локальное зеркало (Nexus/Verdaccio) либо использовать закешированный node_modules.
stages: [lint, type-check, unit, build]

default:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules/]
  before_script:
    - npm ci --prefer-offline

lint:
  stage: lint
  script: npm run lint

type-check:
  stage: type-check
  script: npm run type-check

unit:
  stage: unit
  script: npm run test:unit

build:
  stage: build
  script: npm run build:only
  artifacts:
    paths: [dist/]
